spring.application.name=liga-amateur-backend

# Base H2 en archivo (RNF-03)
spring.datasource.url=jdbc:h2:file:./data/liga_amateur
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# always: recrea la base al arrancar. never: conserva los datos cargados
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola H2 para desarrollo: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Nunca devolver trazas de Java (RNF-08)
server.error.include-stacktrace=never

# JWT (RNF-05): 8 horas de validez. Clave en Base64 de 256 bits o más.
jwt.secret=bGlnYS1hbWF0ZXVyLXNhbnRhZmVzaW5hLWlzdzItZzYtY2xhdmUtc2VjcmV0YS0yMDI2
jwt.expiracion-horas=8
